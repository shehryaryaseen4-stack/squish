name: Gym app · Android, iOS & Windows

on:
  push:
    paths:
      - 'gym-app/**'
      - '.github/workflows/gym-app-mobile.yml'
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Gym server URL baked into the app (blank = ask on first launch)'
        required: false
        default: ''
      ios:
        description: 'Also build the iOS app (uses macOS minutes)'
        type: boolean
        default: true

defaults:
  run:
    working-directory: gym-app

env:
  # Set a repository variable GYM_API_URL (Settings → Secrets and variables → Actions → Variables)
  # so every build talks to your live server without asking.
  API_URL: ${{ inputs.api_url || vars.GYM_API_URL }}
  # Your sales website (e.g. https://gymdesk.com): the apps then accept a gym code,
  # and the Windows app activates licences there.
  PLATFORM_URL: ${{ vars.GYM_PLATFORM_URL }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gym-app/package-lock.json
      - run: npm ci
      - run: npm test

  android:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gym-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Build the app (connects to your server)
        run: |
          node scripts/build-mobile.js
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon -PversionCode=${{ github.run_number }}
          mkdir -p ../apk && cp app/build/outputs/apk/debug/app-debug.apk ../apk/gym-app.apk
      # A second app that needs no server, for trying everything on a phone.
      # It has its own app id and name, so both can be installed side by side.
      - name: Build the offline demo app
        run: |
          DEMO=1 node scripts/build-mobile.js
          npx cap sync android
          cd android
          sed -i 's#<string name="app_name">.*</string>#<string name="app_name">Gym App Demo</string>#; s#<string name="title_activity_main">.*</string>#<string name="title_activity_main">Gym App Demo</string>#' app/src/main/res/values/strings.xml
          ./gradlew assembleDebug --no-daemon -PdemoApp -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/debug/app-debug.apk ../apk/gym-app-demo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: gym-app/apk/*.apk
          if-no-files-found: error
      # Direct download links (no zip, no login on a public repo):
      # https://github.com/<owner>/<repo>/releases/download/app-latest/gym-app-demo.apk
      - name: Publish to the "app-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Gym app · latest test build
          prerelease: true
          body: |
            Test builds from the latest push (build ${{ github.run_number }}).
            - **gym-app-demo.apk**: works without a server. Install it to try everything on your phone.
            - **gym-app.apk**: the real app. It connects to your gym's server.
            - **gym-app-setup.exe**: the Windows app for the front desk computer. It runs the gym server itself and shows the entry screen on a second monitor.
            On the phone: download, open the file, allow "Install unknown apps" for your browser, then Install.
            On Windows: if "Windows protected your PC" shows, click "More info", then "Run anyway".
          files: |
            gym-app/apk/gym-app.apk
            gym-app/apk/gym-app-demo.apk

  # Windows app for the gym's front desk computer.
  # https://github.com/<owner>/<repo>/releases/download/app-latest/gym-app-setup.exe
  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: gym-app/desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gym-app/desktop/package-lock.json
      - run: npm ci
      - run: npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version
      - name: Point the app at your website
        shell: bash
        env:
          PRODUCT_NAME: ${{ vars.PRODUCT_NAME }}
          LICENSE_PUBLIC_KEY: ${{ vars.LICENSE_PUBLIC_KEY }}
        run: |
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('config.json', 'utf8'));
            c.platformUrl = process.env.PLATFORM_URL || c.platformUrl;
            c.publicKey = process.env.LICENSE_PUBLIC_KEY || c.publicKey;
            c.productName = process.env.PRODUCT_NAME || c.productName;
            fs.writeFileSync('config.json', JSON.stringify(c, null, 2));
          "
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: gym-app/desktop/dist/gym-app-setup.exe
          if-no-files-found: error
      - name: Publish to the "app-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          files: gym-app/desktop/dist/gym-app-setup.exe

  # One gym on a Windows laptop, no install: unzip and double-click "Start Gym.bat".
  # https://github.com/<owner>/<repo>/releases/download/app-latest/GymApp-Windows.zip
  windows-zip:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/build-windows-zip.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: gym-app/dist/GymApp-Windows.zip
          if-no-files-found: error
      - name: Publish to the "app-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          files: gym-app/dist/GymApp-Windows.zip

  ios:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gym-app/package-lock.json
      - run: npm ci
      - run: node scripts/build-mobile.js
      - run: npx cap sync ios
      - name: Build for the iOS Simulator (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Zip the simulator app
        run: cd build/Build/Products/Debug-iphonesimulator && zip -qr ../../../../ios-simulator-app.zip App.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: gym-app/ios-simulator-app.zip
