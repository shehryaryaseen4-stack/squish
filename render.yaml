# One-click deploy of the PDF tools site (pdf-tools/) on Render.
# Render dashboard: New + > Blueprint > pick this repo > Apply.
services:
  - type: web
    name: pagefold-pdf-tools
    runtime: docker
    plan: free
    rootDir: pdf-tools
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/status
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: MAX_JOBS
        value: "1"
      - key: MAX_UPLOAD_MB
        value: "50"
