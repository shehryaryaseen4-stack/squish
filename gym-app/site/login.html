<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · {product}</title>
  <meta name="description" content="Open your gym dashboard.">
  <meta name="theme-color" content="#f97316">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/base.css">
  <link rel="stylesheet" href="/site.css">
</head>
<body data-page="login">
  <header data-site-header></header>

  <main class="page"><div class="wrap-site">
    <div class="panel-card">
      <h1>Open your gym</h1>
      <p class="lead">Enter your gym's web address. You'll sign in there with your PIN.</p>
      <form class="form-site" id="find" novalidate>
        <div class="field"><span>Gym web address</span><div class="slug-field"><span data-host>/g/</span><input class="input" name="slug" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="your-gym" required aria-label="Gym web address"></div><div class="hint-line" data-find-hint></div></div>
        <div class="two"><button class="btn btn-primary" type="submit" data-to="admin">Staff dashboard</button><button class="btn btn-ghost" type="submit" data-to="member">Member app</button></div>
      </form>
      <p class="muted" style="margin-top:18px;font-size:14px">Don't have a gym yet? <a class="link" href="/signup">Start a free trial</a></p>
    </div>
  </div></main>

  <footer data-site-footer></footer>
  <script src="/icons.js"></script>
  <script src="/common.js"></script>
  <script src="/site.js"></script>
  <script src="/pages.js"></script>
</body>
</html>
