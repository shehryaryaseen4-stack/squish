# The gym platform next to other websites on the same server (e.g. a Contabo VPS
# that already runs nginx or Apache). The server's own web server handles the
# domain and HTTPS and passes it to the app; see install.sh.
services:
  app:
    build: ../..
    restart: unless-stopped
    environment:
      OWNER_EMAIL: ${OWNER_EMAIL}
      OWNER_PASSWORD: ${OWNER_PASSWORD}
      MACHINE_PORT: ${MACHINE_PORT:-8081}
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
    volumes:
      - gymdata:/data
    ports:
      # Only this server's web server reaches the app directly.
      - "127.0.0.1:${WEB_PORT:-3100}:3100"
      # Fingerprint and face machines talk plain HTTP on this port.
      - "${MACHINE_PORT:-8081}:3100"
volumes:
  gymdata:
