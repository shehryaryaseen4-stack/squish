# Runs the platform on one server with automatic HTTPS.
#   1. Point your domain's DNS (A record) at the server's IP.
#   2. Copy .env.example to .env and fill it in.
#   3. docker compose up -d --build
services:
  app:
    build: ..
    restart: unless-stopped
    environment:
      OWNER_EMAIL: ${OWNER_EMAIL}
      OWNER_PASSWORD: ${OWNER_PASSWORD}
      MACHINE_PORT: ${MACHINE_PORT:-8081}
    volumes:
      - gymdata:/data
    ports:
      # Fingerprint and face machines talk plain HTTP on this port.
      - "${MACHINE_PORT:-8081}:3100"
  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
volumes:
  gymdata:
  caddy_data:
